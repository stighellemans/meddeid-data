[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meddeid-data"
version = "0.2.0"
description = "Synthetic Belgian clinical dataset generation and validation for MedDeID"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "Stig Hellemans"}]
keywords = ["de-identification", "clinical-nlp", "synthetic-data", "belgium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: Dutch",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "meddeid-core>=0.1,<0.2",
    "meddeid-language-nl>=0.1,<0.2",
    "python-dotenv>=1.0.1",
]

[project.urls]
"MedDeID on Hugging Face" = "https://huggingface.co/collections/stighellemans/meddeid"

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
meddeid-data = "meddeid_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meddeid_data = ["resources/clinical/*.jsonl", "resources/clinical/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
